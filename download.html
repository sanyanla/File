<div class="note" id="download-note"></div>
</main>
<footer><div class="wrap">© 2026 Sanyan File Manager · 本地文件管理与 Android 玩机工具</div></footer><button class="top-button" type="button" aria-label="返回顶部" title="返回顶部">↑</button>
<script>(()=>{const body=document.body,toggle=document.querySelector('.theme-toggle'),topBtn=document.querySelector('.top-button'),progress=document.querySelector('#scroll-progress');function applyTheme(t){const dark=t==='dark';body.classList.toggle('dark',dark);if(toggle){toggle.textContent=dark?'☀':'☾';toggle.setAttribute('aria-label',dark?'切换浅色主题':'切换深色主题');toggle.setAttribute('aria-pressed',String(dark));toggle.title=dark?'切换到白天模式':'切换到黑夜模式'}try{localStorage.setItem('sanyan-theme',t)}catch(e){}}/* v13: always start in daytime mode by request */ applyTheme('light');if(toggle)toggle.addEventListener('click',()=>applyTheme(body.classList.contains('dark')?'light':'dark'));function update(){const max=document.documentElement.scrollHeight-innerHeight;if(progress)progress.style.width=(max>0?scrollY/max*100:0)+'%';if(topBtn)topBtn.classList.toggle('show',scrollY>400)}addEventListener('scroll',update,{passive:true});update();if(topBtn)topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));const targets=document.querySelectorAll('section,.card,.item,.note');targets.forEach(el=>el.classList.add('reveal'));if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}}),{threshold:.08});targets.forEach(el=>io.observe(el))}else targets.forEach(el=>el.classList.add('in-view'));async function loadReleaseConfig(){
 let cfg;
 try{const response=await fetch('./versions.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);cfg=await response.json();document.documentElement.dataset.releaseConfig='external'}catch(err){document.documentElement.dataset.releaseConfig='error';document.getElementById('current-release-card').innerHTML='<h3>无法加载版本配置</h3><p>请通过网站服务器或本地 HTTP 预览打开此页面，并确认 versions.json 与 download.html 位于同一目录。</p>';document.getElementById('release-history').innerHTML='';return;}
 const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
 const releases=cfg.releases||[];
 const current=typeof cfg.currentVersion==='string'?(releases.find(r=>r.version===cfg.currentVersion)||{}):(cfg.currentVersion||{});
 const safeUrl=v=>{const raw=String(v||'').trim();if(!raw)return '';try{const u=new URL(raw,location.href);return ['http:','https:'].includes(u.protocol)||(!/^\s*[a-z]+:/i.test(raw)&&!raw.startsWith('//'))?raw:''}catch(e){return ''}};
 const downloadButton=(url,label='下载 APK')=>{const u=safeUrl(url);return u?`<a class="btn primary" href="${esc(u)}" target="_self" referrerpolicy="no-referrer">${esc(label)} ↓</a> <a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">备用打开 ↗</a><div class="download-help">手机无法下载时，请先允许浏览器下载文件；如果跳转后没有反应，可点“备用打开”，或长按备用链接复制地址后在系统浏览器中打开。</div>`:`<span class="btn primary" aria-disabled="true" title="请在 versions.json 对应版本中填写 downloadUrl" style="opacity:.62;cursor:not-allowed">暂未提供下载</span>`};
 document.getElementById('current-release-card').innerHTML=`<div class="head"><div><div class="version">${esc(current.version||'')}</div><div class="meta">${esc(current.stage||'')}</div></div><span class="badge">${esc(current.status||'CURRENT')}</span></div><ul>${(current.features||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${downloadButton(current.downloadUrl,'下载当前版本')}`;
 document.getElementById('history-title').textContent=cfg.historyTitle||'历史版本与更新说明';
 document.getElementById('history-description').textContent=cfg.historyDescription||'';
 document.getElementById('history-count').textContent=`CHANGELOG · ${releases.length} 个版本`;
 document.getElementById('release-history').innerHTML=releases.map((r,i)=>`<article class="release"><div class="release-side"><div><div class="release-version">${esc(r.version)}</div><div class="release-date">${esc(r.date||'')}</div></div><span class="release-type">${esc(r.type||'更新')}</span></div><div class="release-body"><div class="release-head"><div><h3>${esc(r.title||'')}</h3><p class="release-summary">${esc(r.summary||'')}</p></div></div><div class="release-tags">${(r.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><details ${r.expanded?'open':''}><summary>${esc(r.detailsTitle||'查看更新说明')}</summary><ul class="change-list">${(r.details||[]).map(d=>`<li><span class="change-icon">✓</span><span><b>${esc(d.title)}：</b>${esc(d.description)}</span></li>`).join('')}</ul>${r.note?`<p class="release-note">${esc(r.note)}</p>`:''}</details><div class="release-actions">${(()=>{const u=safeUrl(r.downloadUrl);return u?`<a class="release-download" href="${esc(u)}" target="_self" referrerpolicy="no-referrer">下载 ${esc(r.version||'此版本')} ↓</a><a class="release-download secondary" href="${esc(u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">备用打开 ↗</a>`:`<span class="release-download disabled" aria-disabled="true" title="请在 versions.json 对应版本中配置 downloadUrl">暂未提供下载</span>`})()}</div></div></article>`).join('');
 document.getElementById('history-note').textContent=cfg.historyNote||'';
 document.getElementById('download-note').textContent=cfg.downloadNote||'';
}
loadReleaseConfig();
})();</script>
</body>
</html>
